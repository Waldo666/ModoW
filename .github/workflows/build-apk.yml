name: Build Modo W APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer Modo W
        run: unzip -q ModoW-proyecto.zip -d extracted

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: extracted/ModoW
        run: gradle :app:assembleDebug --stacktrace

      - name: Verificar firma
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose extracted/ModoW/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ModoW-APK
          path: extracted/ModoW/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
