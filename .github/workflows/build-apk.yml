name: Build W-mode Release

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODOW_KEYSTORE_BASE64: ${{ secrets.MODOW_KEYSTORE_BASE64 }}
      MODOW_KEYSTORE_PASSWORD: ${{ secrets.MODOW_KEYSTORE_PASSWORD }}
      MODOW_KEY_ALIAS: ${{ secrets.MODOW_KEY_ALIAS }}
      MODOW_KEY_PASSWORD: ${{ secrets.MODOW_KEY_PASSWORD }}

    steps:
      - name: Publicar inicio de build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"W-mode release compilando\",\"context\":\"W-mode Release\"}"

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Android y firma
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          rm -rf /tmp/gradle-8.9
          unzip -q /tmp/gradle.zip -d /tmp

          if [ -n "${MODOW_KEYSTORE_BASE64:-}" ] && \
             [ -n "${MODOW_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${MODOW_KEY_ALIAS:-}" ] && \
             [ -n "${MODOW_KEY_PASSWORD:-}" ]; then
            echo "$MODOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/modow-release.jks"
            chmod 600 "$RUNNER_TEMP/modow-release.jks"
            echo "MODOW_KEYSTORE_PATH=$RUNNER_TEMP/modow-release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
          fi

      - name: Compilar release
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          /tmp/gradle-8.9/bin/gradle :app:assembleRelease --stacktrace

          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/W-mode-v1.5.1.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/W-mode-v1.5.1-unsigned.apk
          fi

      - name: Verificar firma
        if: env.SIGNED_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/W-mode-v1.5.1.apk

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: W-mode-v1.5.1-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Crear Release oficial
        if: github.ref == 'refs/heads/main' && env.SIGNED_BUILD == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.5.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/W-mode-v1.5.1.apk --clobber
          else
            gh release create "$TAG" dist/W-mode-v1.5.1.apk \
              --target "$GITHUB_SHA" \
              --title "W-mode v1.5.1" \
              --notes "Versión estable: backup/importación, build release y firma permanente automatizable."
          fi

      - name: Publicar estado de build
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="${{ job.status }}"
          if [ "$STATE" = "cancelled" ]; then STATE="error"; fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"W-mode release $STATE\",\"context\":\"W-mode Release\"}"
