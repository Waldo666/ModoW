plugins {
    id 'com.android.application'
}

android {
    namespace 'com.waldo.modow'
    compileSdk 35

    defaultConfig {
        applicationId 'com.waldo.modow'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '1.5.1'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('MODOW_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isBlank()) {
                storeFile file(ksPath)
                storePassword System.getenv('MODOW_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MODOW_KEY_ALIAS')
                keyPassword System.getenv('MODOW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MODOW_KEYSTORE_PATH') != null && !System.getenv('MODOW_KEYSTORE_PATH').isBlank()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
